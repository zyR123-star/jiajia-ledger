<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4F6EF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15131b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="佳嘉记账">
  <title>佳嘉记账</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M9 22V12h6v10"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8 6h13M8 12h13M8 18h13"/>
      <path d="M3 6h.01M3 12h.01M3 18h.01"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <path d="M21 12c.55 0 1-.45.95-1A10 10 0 0 0 13 2.05c-.55-.05-1 .4-1 .95v8a1 1 0 0 0 1 1z"/>
      <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M5 12h14M12 5v14"/>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <path d="M14 2v6h6M8 13h8M8 17h6"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24">
      <path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15v14H5a2 2 0 0 1-2-2V5"/>
      <path d="M16 13h3"/>
    </symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <path d="M16 2v4M8 2v4M3 10h18"/>
    </symbol>
    <symbol id="i-lock" viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="11" rx="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
    </symbol>
    <symbol id="i-users" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>
    </symbol>
    <symbol id="i-log-out" viewBox="0 0 24 24">
      <path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
    </symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/jiajia-mascot.svg" alt="">
        </span>
        <div>
          <strong>佳嘉记账</strong>
          <span>彼此看见，也各自留一点空间</span>
        </div>
      </div>
      <button class="icon-button" id="headerAddButton" type="button" aria-label="记一笔">
        <svg><use href="#i-plus"></use></svg>
      </button>
    </header>

    <main id="main">
      <section class="view" id="view-home" aria-labelledby="homeTitle">
        <h1 class="sr-only" id="homeTitle">佳嘉记账首页</h1>

        <section class="balance-hero" aria-label="本月收支概览">
          <div class="hero-month">
            <button class="hero-arrow" type="button" data-month="-1" aria-label="上个月">
              <svg><use href="#i-chevron-left"></use></svg>
            </button>
            <strong id="heroMonthLabel"></strong>
            <button class="hero-arrow" type="button" data-month="1" aria-label="下个月">
              <svg><use href="#i-chevron-right"></use></svg>
            </button>
          </div>
          <p class="eyebrow">本月支出</p>
          <div class="hero-amount" id="monthExpense">¥0.00</div>
          <div class="hero-grid">
            <div>
              <span>本月收入</span>
              <strong id="monthIncome">¥0.00</strong>
            </div>
            <div>
              <span>本月结余</span>
              <strong id="monthBalance">¥0.00</strong>
            </div>
          </div>
          <svg class="hero-mascot" viewBox="0 0 160 130" aria-hidden="true">
            <circle cx="80" cy="68" r="48" fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M55 66c4 0 7 3 7 7M98 66c4 0 7 3 7 7M70 82c7 5 13 5 20 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <path d="M24 17l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM135 19c3-5 10-4 10 2 0 6-10 12-10 12s-10-6-10-12c0-6 7-7 10-2z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
          </svg>
        </section>

        <div class="quick-actions" aria-label="快捷记账">
          <button type="button" class="quick-action quick-expense" data-quick="expense">
            <span class="quick-icon">支</span>
            <span><strong>记支出</strong><small>刚花出去的钱</small></span>
          </button>
          <button type="button" class="quick-action quick-income" data-quick="income">
            <span class="quick-icon">收</span>
            <span><strong>记收入</strong><small>收到的每一笔</small></span>
          </button>
        </div>

        <section class="content-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow dark">最近账单</p>
              <h2>这几笔，都记得</h2>
            </div>
            <button class="text-button" type="button" data-view="ledger">全部明细</button>
          </div>
          <div class="bill-list" id="recentList"></div>
        </section>
      </section>

      <section class="view" id="view-ledger" aria-labelledby="ledgerTitle" hidden>
        <div class="view-heading">
          <div>
            <p class="eyebrow dark">账本</p>
            <h1 id="ledgerTitle">全部账单</h1>
          </div>
          <span class="count-pill" id="ledgerCount">0 笔</span>
        </div>
        <div class="search-field">
          <svg><use href="#i-search"></use></svg>
          <input id="ledgerSearch" type="search" placeholder="搜备注、分类或账户" autocomplete="off">
        </div>
        <div class="segmented" id="ledgerFilter" aria-label="账单类型">
          <button class="is-on" type="button" data-filter="all">全部</button>
          <button type="button" data-filter="expense">支出</button>
          <button type="button" data-filter="income">收入</button>
        </div>
        <div class="segmented owner-filter" id="ownerFilter" aria-label="账单来源" hidden>
          <button class="is-on" type="button" data-owner-filter="all">双方</button>
          <button type="button" data-owner-filter="mine">我的</button>
          <button type="button" data-owner-filter="partner">对方</button>
        </div>
        <div class="ledger-content" id="ledgerList"></div>
      </section>

      <section class="view" id="view-stats" aria-labelledby="statsTitle" hidden>
        <div class="view-heading">
          <div>
            <p class="eyebrow dark">月度回顾</p>
            <h1 id="statsTitle">钱都花在哪</h1>
          </div>
          <div class="compact-month">
            <button class="mini-arrow" type="button" data-month="-1" aria-label="上个月">
              <svg><use href="#i-chevron-left"></use></svg>
            </button>
            <span id="statsMonthLabel"></span>
            <button class="mini-arrow" type="button" data-month="1" aria-label="下个月">
              <svg><use href="#i-chevron-right"></use></svg>
            </button>
          </div>
        </div>

        <section class="stats-overview">
          <div class="stats-donut" id="statsDonut">
            <div class="stats-donut-center">
              <span>支出</span>
              <strong id="statsTotal">¥0</strong>
            </div>
          </div>
          <div class="stats-totals">
            <div><span>收入</span><strong id="statsIncome">¥0</strong></div>
            <div><span>结余</span><strong id="statsBalance">¥0</strong></div>
          </div>
        </section>

        <section class="content-section">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow dark">分类</p>
              <h2>支出排行</h2>
            </div>
          </div>
          <div class="category-rank" id="categoryRank"></div>
        </section>

        <section class="content-section">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow dark">节奏</p>
              <h2>每日支出</h2>
            </div>
          </div>
          <div class="trend-chart" id="trendChart"></div>
        </section>
      </section>

      <section class="view" id="view-settings" aria-labelledby="settingsTitle" hidden>
        <div class="view-heading">
          <div>
            <p class="eyebrow dark">账本设置</p>
            <h1 id="settingsTitle">把数据收好</h1>
          </div>
        </div>

        <section class="settings-panel">
          <div class="settings-row">
            <span class="settings-icon blue"><svg><use href="#i-wallet"></use></svg></span>
            <div>
              <strong id="ledgerModeLabel">本机账本</strong>
              <span id="recordSummary">0 笔账单</span>
            </div>
          </div>
          <div class="settings-row">
            <span class="settings-icon mint"><svg><use href="#i-check"></use></svg></span>
            <div>
              <strong id="syncModeLabel">离线可用</strong>
              <span id="storageSummary">正在检查存储空间</span>
            </div>
          </div>
        </section>

        <section class="settings-group">
          <h2>共享账本</h2>
          <div id="cloudPanel" class="cloud-panel">
            <div class="cloud-loading">正在读取共享状态</div>
          </div>
        </section>

        <section class="settings-group">
          <h2>备份与迁移</h2>
          <button class="settings-action" type="button" id="exportJsonButton">
            <span class="settings-icon blue"><svg><use href="#i-download"></use></svg></span>
            <span><strong>导出完整备份</strong><small>JSON，换设备后可完整恢复</small></span>
            <svg class="row-arrow"><use href="#i-chevron-right"></use></svg>
          </button>
          <button class="settings-action" type="button" id="importButton">
            <span class="settings-icon pink"><svg><use href="#i-upload"></use></svg></span>
            <span><strong>从备份恢复</strong><small>恢复前会先确认</small></span>
            <svg class="row-arrow"><use href="#i-chevron-right"></use></svg>
          </button>
          <button class="settings-action" type="button" id="exportCsvButton">
            <span class="settings-icon yellow"><svg><use href="#i-file"></use></svg></span>
            <span><strong>导出表格</strong><small>CSV，可直接用表格软件打开</small></span>
            <svg class="row-arrow"><use href="#i-chevron-right"></use></svg>
          </button>
          <input id="importInput" type="file" accept="application/json,.json" hidden>
        </section>

        <section class="settings-group">
          <h2>关于</h2>
          <div class="about-card">
            <div class="about-cloud" aria-hidden="true">
              <img src="assets/jiajia-mascot.svg" alt="">
            </div>
            <div>
              <strong>佳嘉记账 <span>v1.0.0</span></strong>
              <p>私密账单只有自己能看到；对方可见账单仅允许对方查看，不能修改。</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-on" type="button" data-view="home">
        <svg><use href="#i-home"></use></svg><span>首页</span>
      </button>
      <button class="tab" type="button" data-view="ledger">
        <svg><use href="#i-list"></use></svg><span>明细</span>
      </button>
      <button class="add-button" id="tabAddButton" type="button" aria-label="记一笔">
        <svg><use href="#i-plus"></use></svg>
      </button>
      <button class="tab" type="button" data-view="stats">
        <svg><use href="#i-chart"></use></svg><span>统计</span>
      </button>
      <button class="tab" type="button" data-view="settings">
        <svg><use href="#i-settings"></use></svg><span>设置</span>
      </button>
    </nav>
  </div>

  <div class="sheet-layer" id="sheetLayer" hidden>
    <button class="sheet-backdrop" id="sheetBackdrop" type="button" aria-label="关闭记账窗口"></button>
    <section class="edit-sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <header class="sheet-heading">
        <div>
          <p class="eyebrow dark" id="sheetEyebrow">新账单</p>
          <h2 id="sheetTitle">今天花了什么</h2>
        </div>
        <button class="icon-button sheet-close" id="sheetClose" type="button" aria-label="关闭">
          <svg><use href="#i-x"></use></svg>
        </button>
      </header>

      <form id="transactionForm" novalidate>
        <div class="readonly-banner" id="readonlyBanner" hidden>
          <svg><use href="#i-lock"></use></svg>
          这是对方分享的账单，仅可查看
        </div>

        <div class="type-switch" id="typeSwitch" aria-label="收支类型">
          <button class="is-on expense" type="button" data-type="expense">支出</button>
          <button class="income" type="button" data-type="income">收入</button>
        </div>

        <label class="amount-field">
          <span>金额</span>
          <div>
            <b>¥</b>
            <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
          </div>
        </label>

        <fieldset class="form-section category-section">
          <legend>分类</legend>
          <div class="category-grid" id="categoryGrid"></div>
        </fieldset>

        <div class="form-section">
          <span class="field-label">账户</span>
          <div class="account-chips" id="accountChips"></div>
        </div>

        <div class="form-section" id="visibilitySection">
          <span class="field-label">对方能否查看</span>
          <div class="visibility-switch" id="visibilitySwitch">
            <button class="is-on" type="button" data-visibility="private">
              <svg><use href="#i-lock"></use></svg>
              仅自己
            </button>
            <button type="button" data-visibility="partner">
              <svg><use href="#i-users"></use></svg>
              对方可见
            </button>
          </div>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>日期</span>
            <span class="field-control">
              <svg><use href="#i-calendar"></use></svg>
              <input id="dateInput" type="date" required>
            </span>
          </label>
          <label class="field">
            <span>备注</span>
            <input id="noteInput" type="text" maxlength="80" placeholder="可选" autocomplete="off">
          </label>
        </div>

        <div class="sheet-actions">
          <button class="delete-button" id="deleteButton" type="button" hidden>
            <svg><use href="#i-trash"></use></svg>
            删除
          </button>
          <button class="save-button" id="saveButton" type="submit">
            <svg><use href="#i-check"></use></svg>
            保存这笔
          </button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
